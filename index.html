<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tua 15s">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#111318">
<meta name="robots" content="noindex, nofollow">
<title>Tua nhanh 15s</title>
<style>
  :root { --bg: #111318; --card: #1c1f27; --line: #2c303b; --text: #f2f3f5; --mute: #9aa0ad; --accent: #ffcc33; --ok: #4cd18a; --err: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
  /* Vừa viền iPhone (như Món Ngon): thanh tiêu đề dính mép trên, nền kín phủ cả vùng giờ/pin, chữ nằm dưới vùng đó */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; pointer-events: none; }
  header h1 { margin: 0; font-size: 20px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 12px 16px;
    border: 0; border-radius: 14px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn.main { background: var(--accent); color: #1a1a1a; }
  .btn.sub { background: #2a2e39; color: var(--text); }
  .btn:disabled { opacity: .45; }
  input[type=file] { display: none; }
  video { width: 100%; max-height: 55vh; border-radius: 12px; background: #000; display: block; }
  input[type=range] { width: 100%; height: 36px; accent-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .muted { color: var(--mute); font-size: 15px; }
  .big { font-size: 19px; font-weight: 700; }
  .hide { display: none !important; }
  .msg { padding: 10px 12px; border-radius: 12px; background: #2a2e39; font-size: 15px; }
  .msg.err { background: #3a1f22; color: #ffb4b4; }
  .bar { height: 10px; border-radius: 6px; background: #2a2e39; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10,11,14,.92); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  .overlay .btn { max-width: 420px; min-height: 96px; font-size: 24px; border-radius: 22px; }
  .msg.ok { background: #18352a; color: #b9f3d3; }
</style>
</head>
<body>
<header><h1>⏩ Tua nhanh video còn 15 giây</h1></header>
<main>
  <label class="btn main" for="file">🎬 Chọn video</label>
  <input id="file" type="file" accept="video/*,.mov,.mp4,.m4v">
  <div class="muted" id="hint">Chọn video quay bằng iPhone. App tua nhanh cả video cho vừa đúng 15 giây (30 khung/giây, giữ độ nét và tỉ lệ khung hình), làm ngay trên máy, không gửi đi đâu. Video tua nhanh không có tiếng.</div>

  <section class="card hide" id="editCard">
    <video id="src" playsinline controls preload="metadata"></video>
    <div class="muted" id="info"></div>
    <div class="big" id="speed"></div>
    <button class="btn main" id="goBtn">⏩ Tua nhanh còn 15 giây</button>
    <div class="bar hide" id="bar"><div id="barFill"></div></div>
    <div class="msg hide" id="msg"></div>
  </section>

  <section class="card hide" id="outCard">
    <div class="big">✓ Xong</div>
    <video id="out" playsinline controls loop></video>
    <div class="muted" id="outInfo"></div>
    <button class="btn main" id="shareBtn">📥 Lưu vào Ảnh</button>
    <a class="btn sub" id="dl" download>Tải file về</a>
  </section>
</main>
<div class="overlay hide" id="saveBox">
  <div class="big">✓ Đã tua xong</div>
  <button class="btn main" id="saveBig">📥 Lưu vào Ảnh</button>
  <div class="muted">Bấm nút trên, rồi chọn <b>Lưu video</b>.</div>
  <button class="btn sub" id="saveSkip" style="min-height:48px;font-size:17px;max-width:200px">Để sau</button>
</div>

<script>
'use strict';
const LEN = 15, FPS = 30; // video ra: 15 giây, 30 khung/giây
const $ = (id) => document.getElementById(id);
let file = null, movie = null, srcUrl = '', outUrl = '', outFile = null, busy = false;

// ---------- Đọc / ghi hộp MP4-MOV ----------
const CONTAINERS = new Set(['moov', 'trak', 'mdia', 'minf', 'stbl', 'edts', 'dinf']);
const u32 = (d, o) => d.getUint32(o);
const u64 = (d, o) => d.getUint32(o) * 4294967296 + d.getUint32(o + 4);
const typeAt = (u8, o) => String.fromCharCode(u8[o], u8[o + 1], u8[o + 2], u8[o + 3]);

function parseBoxes(u8, start, end) {
  const d = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), out = [];
  let p = start;
  while (p + 8 <= end) {
    let size = u32(d, p), hdr = 8;
    const type = typeAt(u8, p + 4);
    if (size === 1) { size = u64(d, p + 8); hdr = 16; } else if (size === 0) size = end - p;
    if (size < hdr || p + size > end) break;
    const node = { type, hdr, data: u8.subarray(p, p + size) };
    if (CONTAINERS.has(type)) node.kids = parseBoxes(u8, p + hdr, p + size);
    out.push(node);
    p += size;
  }
  return out;
}
const find = (node, type) => node.kids && node.kids.find((k) => k.type === type);
const path = (node, ...types) => types.reduce((n, t) => n && find(n, t), node);
const dv = (b) => new DataView(b.data.buffer, b.data.byteOffset, b.data.byteLength);

function concat(parts) {
  const n = parts.reduce((a, p) => a + p.length, 0), out = new Uint8Array(n);
  let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function box(type, ...parts) {
  const body = concat(parts), out = new Uint8Array(8 + body.length), d = new DataView(out.buffer);
  d.setUint32(0, out.length);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  out.set(body, 8);
  return out;
}
function words(arr, signed) { // mảng số 32 bit
  const out = new Uint8Array(arr.length * 4), d = new DataView(out.buffer);
  arr.forEach((v, i) => signed ? d.setInt32(i * 4, v) : d.setUint32(i * 4, v));
  return out;
}
const fullbox = (type, ver, flags, ...parts) => box(type, words([(ver << 24) | flags]), ...parts);
function serialize(node) {
  if (!node.kids) return node.data;
  return box(node.type, ...node.kids.map(serialize));
}
function setDur(b, off0, off1, v) { // ghi thời lượng vào mvhd/tkhd/mdhd (bản 0 hoặc 1)
  const d = dv(b), ver = b.data[b.hdr];
  if (ver === 1) { d.setUint32(b.hdr + off1, Math.floor(v / 4294967296)); d.setUint32(b.hdr + off1 + 4, v >>> 0); }
  else d.setUint32(b.hdr + off0, Math.min(v, 0xffffffff));
}

// Đọc bảng mẫu của một track
function readTrack(trak, movieScale) {
  const mdhd = path(trak, 'mdia', 'mdhd'), hdlr = path(trak, 'mdia', 'hdlr');
  const stbl = path(trak, 'mdia', 'minf', 'stbl');
  if (!mdhd || !hdlr || !stbl) return null;
  const handler = typeAt(hdlr.data, hdlr.hdr + 8);
  const md = dv(mdhd), mver = mdhd.data[mdhd.hdr];
  const scale = u32(md, mdhd.hdr + (mver === 1 ? 20 : 12));
  const t = { trak, handler, scale, stbl };

  // Thời lượng từng mẫu (stts)
  const stts = find(stbl, 'stts'), sd = dv(stts), sttsN = u32(sd, stts.hdr + 4);
  const durs = [];
  for (let i = 0; i < sttsN; i++) {
    const c = u32(sd, stts.hdr + 8 + i * 8), delta = u32(sd, stts.hdr + 12 + i * 8);
    for (let j = 0; j < c; j++) durs.push(delta);
  }
  const n = durs.length;
  const dts = new Float64Array(n);
  for (let i = 1; i < n; i++) dts[i] = dts[i - 1] + durs[i - 1];
  t.durs = durs; t.dts = dts; t.n = n;

  // Lệch thời điểm hiển thị (ctts)
  const ctts = find(stbl, 'ctts');
  t.ctts = new Int32Array(n);
  if (ctts) {
    const cd = dv(ctts), cn = u32(cd, ctts.hdr + 4); let k = 0;
    for (let i = 0; i < cn; i++) {
      const c = u32(cd, ctts.hdr + 8 + i * 8), off = cd.getInt32(ctts.hdr + 12 + i * 8);
      for (let j = 0; j < c && k < n; j++) t.ctts[k++] = off;
    }
    t.hasCtts = true;
  }

  // Khung hình chính (stss) — không có thì mọi mẫu đều là khung chính
  const stss = find(stbl, 'stss');
  if (stss) {
    const d = dv(stss), c = u32(d, stss.hdr + 4);
    t.sync = new Uint8Array(n);
    for (let i = 0; i < c; i++) { const s = u32(d, stss.hdr + 8 + i * 4) - 1; if (s < n) t.sync[s] = 1; }
  }

  // Kích thước mẫu (stsz)
  const stsz = find(stbl, 'stsz');
  if (!stsz) throw new Error('Định dạng chưa hỗ trợ (không có stsz).');
  const zd = dv(stsz), fixed = u32(zd, stsz.hdr + 4);
  t.sizes = new Uint32Array(n);
  for (let i = 0; i < n; i++) t.sizes[i] = fixed || u32(zd, stsz.hdr + 12 + i * 4);

  // Vị trí mẫu trong file (stsc + stco/co64)
  const stco = find(stbl, 'stco'), co64 = find(stbl, 'co64');
  const chunks = [];
  if (stco) { const d = dv(stco), c = u32(d, stco.hdr + 4); for (let i = 0; i < c; i++) chunks.push(u32(d, stco.hdr + 8 + i * 4)); }
  else if (co64) { const d = dv(co64), c = u32(d, co64.hdr + 4); for (let i = 0; i < c; i++) chunks.push(u64(d, co64.hdr + 8 + i * 8)); }
  const stsc = find(stbl, 'stsc'), scd = dv(stsc), scn = u32(scd, stsc.hdr + 4);
  const ent = [];
  for (let i = 0; i < scn; i++) ent.push([u32(scd, stsc.hdr + 8 + i * 12) - 1, u32(scd, stsc.hdr + 12 + i * 12), u32(scd, stsc.hdr + 16 + i * 12)]);
  t.offs = new Float64Array(n); t.sdi = new Uint32Array(n);
  let s = 0;
  for (let e = 0; e < ent.length && s < n; e++) {
    const last = e + 1 < ent.length ? ent[e + 1][0] : chunks.length;
    for (let c = ent[e][0]; c < last && s < n; c++) {
      let o = chunks[c];
      for (let j = 0; j < ent[e][1] && s < n; j++) { t.offs[s] = o; t.sdi[s] = ent[e][2]; o += t.sizes[s]; s++; }
    }
  }

  // Danh sách sửa (edts/elst): đoạn trễ đầu + điểm bắt đầu của media
  t.delay = 0; t.e0 = 0;
  const elst = path(trak, 'edts', 'elst');
  if (elst) {
    const d = dv(elst), ver = elst.data[elst.hdr], c = u32(d, elst.hdr + 4), sz = ver === 1 ? 20 : 12;
    for (let i = 0; i < c; i++) {
      const p = elst.hdr + 8 + i * sz;
      const segDur = ver === 1 ? u64(d, p) : u32(d, p);
      const mt = ver === 1 ? d.getInt32(p + 8) * 4294967296 + d.getUint32(p + 12) : d.getInt32(p + 4);
      if (mt === -1) t.delay += segDur / movieScale; else { t.e0 = mt; break; }
    }
  }
  t.pres = (i) => (t.dts[i] + t.ctts[i] - t.e0) / t.scale + t.delay; // giây hiển thị của mẫu i
  t.mediaDur = (dts[n - 1] + durs[n - 1] - t.e0) / scale + t.delay;
  return t;
}

async function readFileBytes(f, a, b) { return new Uint8Array(await f.slice(a, b).arrayBuffer()); }

async function openMovie(f) {
  // Tìm hộp ftyp và moov ở cấp ngoài cùng (không đọc cả file vào bộ nhớ)
  let p = 0, ftyp = null, moovPos = null;
  while (p + 8 <= f.size) {
    const h = await readFileBytes(f, p, p + 16), d = new DataView(h.buffer);
    let size = u32(d, 0); const type = typeAt(h, 4);
    if (size === 1) size = u64(d, 8); else if (size === 0) size = f.size - p;
    if (size < 8) break;
    if (type === 'ftyp') ftyp = await readFileBytes(f, p, p + size);
    if (type === 'moov') moovPos = [p, p + size];
    p += size;
  }
  if (!moovPos) throw new Error('Không đọc được video này (không tìm thấy phần mô tả moov).');
  const moovBytes = await readFileBytes(f, moovPos[0], moovPos[1]);
  const moov = parseBoxes(moovBytes, 0, moovBytes.length)[0];
  const mvhd = find(moov, 'mvhd'), md = dv(mvhd), ver = mvhd.data[mvhd.hdr];
  const scale = u32(md, mvhd.hdr + (ver === 1 ? 20 : 12));
  const tracks = moov.kids.filter((k) => k.type === 'trak').map((tk) => readTrack(tk, scale))
    .filter((t) => t && (t.handler === 'vide' || t.handler === 'soun') && t.n > 0);
  const video = tracks.find((t) => t.handler === 'vide');
  if (!tracks.length) throw new Error('Video không có hình hoặc tiếng.');
  const duration = Math.max(...tracks.map((t) => t.mediaDur));
  return { ftyp, moov, mvhd, scale, tracks, video, duration };
}

// ---------- Mã codec cho bộ giải mã ----------
const hex2 = (n) => n.toString(16).padStart(2, '0');
function videoConfig(v) {
  const stsd = find(v.stbl, 'stsd');
  const e = stsd.hdr + 8, u8 = stsd.data, d = dv(stsd);
  const type = typeAt(u8, e + 4), eEnd = e + u32(d, e);
  const w = d.getUint16(e + 32), h = d.getUint16(e + 34);
  let p = e + 86, codec = null, desc = null;
  while (p + 8 <= eEnd) {
    const size = u32(d, p), bt = typeAt(u8, p + 4);
    if (size < 8) break;
    const b = u8.subarray(p + 8, p + size);
    if (bt === 'avcC') { desc = b; codec = type + '.' + hex2(b[1]) + hex2(b[2]) + hex2(b[3]); }
    if (bt === 'hvcC') {
      desc = b;
      const space = b[1] >> 6, tier = (b[1] >> 5) & 1, prof = b[1] & 31;
      let compat = ((b[2] << 24) | (b[3] << 16) | (b[4] << 8) | b[5]) >>> 0, rev = 0;
      for (let i = 0; i < 32; i++) { rev = (rev << 1) | (compat & 1); compat >>>= 1; }
      const cons = Array.from(b.subarray(6, 12));
      while (cons.length && !cons[cons.length - 1]) cons.pop();
      codec = [type, ['', 'A', 'B', 'C'][space] + prof, (rev >>> 0).toString(16), (tier ? 'H' : 'L') + b[12], ...cons.map((c) => c.toString(16))].join('.');
    }
    p += size;
  }
  if (!codec) throw new Error('Chưa hỗ trợ kiểu nén video này (' + type + ').');
  return { codec, description: desc.slice(), codedWidth: w, codedHeight: h };
}

// ---------- Tua nhanh: giải mã → chọn khung → mã hoá lại ----------
async function speedUp(m, onProgress) {
  const v = m.video;
  if (!v) throw new Error('File không có hình.');
  if (!window.VideoDecoder || !window.VideoEncoder) throw new Error('Máy chưa hỗ trợ. Cần iPhone chạy iOS 16.4 trở lên (Safari).');
  const dcfg = videoConfig(v);
  if (!(await VideoDecoder.isConfigSupported(dcfg)).supported) throw new Error('Máy không giải mã được video này (' + dcfg.codec + ').');

  // Thứ tự hiển thị của các khung
  const order = Array.from({ length: v.n }, (_, i) => i).sort((a, b) => v.pres(a) - v.pres(b));
  const t0 = v.pres(order[0]), t1 = v.pres(order[v.n - 1]) + v.durs[order[v.n - 1]] / v.scale;
  const N = Math.round(LEN * FPS), span = t1 - t0;
  const targets = Array.from({ length: N }, (_, j) => t0 + (j * span) / N);

  // Chỉ giải mã những khung cần (từ khung chính gần nhất tới khung được chọn)
  const need = new Uint8Array(v.n);
  let oi = 0;
  for (const t of targets) {
    while (oi + 1 < v.n && v.pres(order[oi + 1]) <= t + 1e-6) oi++;
    let d = order[oi], k = d;
    while (k > 0 && v.sync && !v.sync[k]) k--;
    for (let i = d; i >= k && !need[i]; i--) need[i] = 1;
  }
  const feed = [];
  for (let i = 0; i < v.n; i++) if (need[i]) feed.push(i);

  let W = 0, H = 0, canvas, ctx, encoder = null, avcC = null, failed = null;
  const out = [];
  let j = 0, prev = null, encodedCount = 0;

  const startEncoder = async (frame) => {
    W = frame.displayWidth & ~1; H = frame.displayHeight & ~1;
    canvas = window.OffscreenCanvas ? new OffscreenCanvas(W, H) : Object.assign(document.createElement('canvas'), { width: W, height: H });
    ctx = canvas.getContext('2d');
    const big = W * H > 2100000;
    const codecs = big ? ['avc1.640033', 'avc1.4d0033'] : ['avc1.640028', 'avc1.4d0028', 'avc1.42e028'];
    let cfg = null;
    for (const c of codecs) {
      const t = { codec: c, width: W, height: H, bitrate: big ? 40e6 : 16e6, framerate: FPS, avc: { format: 'avc' }, latencyMode: 'realtime' };
      if ((await VideoEncoder.isConfigSupported(t)).supported) { cfg = t; break; }
    }
    if (!cfg) throw new Error('Máy không mã hoá được video ' + W + '×' + H + '.');
    encoder = new VideoEncoder({
      output: (chunk, meta) => {
        const dsc = meta && meta.decoderConfig && meta.decoderConfig.description;
        if (dsc && !avcC) avcC = ArrayBuffer.isView(dsc) ? new Uint8Array(dsc.buffer, dsc.byteOffset, dsc.byteLength).slice() : new Uint8Array(dsc).slice();
        const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
        out.push({ data, ts: chunk.timestamp, key: chunk.type === 'key' });
        encodedCount++;
      },
      error: (e) => { failed = e; },
    });
    encoder.configure(cfg);
  };

  const emit = (frame, idx) => {
    ctx.drawImage(frame, 0, 0, W, H);
    const vf = new VideoFrame(canvas, { timestamp: Math.round((idx * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    encoder.encode(vf, { keyFrame: idx % FPS === 0 });
    vf.close();
  };
  // Khung ra theo thứ tự hiển thị; khung cho mốc t = khung cuối cùng có thời điểm ≤ t
  let pendingFrame = null; const frameQueue = [];
  const onFrame = (frame) => frameQueue.push(frame);
  const drain = async () => {
    while (frameQueue.length) {
      const frame = frameQueue.shift();
      if (failed) { frame.close(); continue; }
      if (!encoder) await startEncoder(frame);
      const p = frame.timestamp / 1e6;
      while (j < N && targets[j] < p - 1e-6) { emit(prev || frame, j); j++; }
      if (prev) prev.close();
      prev = frame;
      onProgress(j / N);
    }
  };

  const decoder = new VideoDecoder({ output: onFrame, error: (e) => { failed = e; } });
  decoder.configure(dcfg);

  // Đọc dữ liệu theo từng khối lớn cho nhanh
  let cache = null;
  const readSample = async (i) => {
    const o = v.offs[i], s = v.sizes[i];
    if (!cache || o < cache.start || o + s > cache.start + cache.bytes.length) {
      cache = { start: o, bytes: await readFileBytes(file, o, Math.min(file.size, o + Math.max(s, 4 << 20))) };
    }
    return cache.bytes.subarray(o - cache.start, o - cache.start + s);
  };

  let last = -1;
  for (const i of feed) {
    if (failed) break;
    if (last >= 0 && i !== last + 1) {
      // Nhảy qua đoạn bỏ: xả hết khung đang chờ rồi giải mã lại từ khung chính (tránh khung mượn đoạn trước)
      await decoder.flush().catch((e) => { failed = e; });
      await drain();
      decoder.reset(); decoder.configure(dcfg);
    }
    last = i;
    const data = await readSample(i);
    decoder.decode(new EncodedVideoChunk({
      type: !v.sync || v.sync[i] ? 'key' : 'delta',
      timestamp: Math.round(v.pres(i) * 1e6),
      duration: Math.round((v.durs[i] / v.scale) * 1e6),
      data,
    }));
    while (!failed && (decoder.decodeQueueSize > 6 || (encoder && encoder.encodeQueueSize > 6) || frameQueue.length)) {
      await drain();
      if (decoder.decodeQueueSize > 6 || (encoder && encoder.encodeQueueSize > 6)) await new Promise((r) => setTimeout(r, 2));
    }
  }
  if (!failed) { await decoder.flush().catch((e) => { failed = e; }); await drain(); }
  if (!failed && prev) { while (j < N) { emit(prev, j); j++; } }
  if (prev) prev.close();
  try { decoder.close(); } catch (_) {}
  if (failed) throw new Error(failed.message || String(failed));
  if (!encoder) throw new Error('Không đọc được khung hình nào.');
  await encoder.flush();
  encoder.close();
  if (!avcC || !out.length) throw new Error('Mã hoá lỗi.');
  return { samples: out, avcC, W, H, srcDur: span, speed: span / LEN };
}

// ---------- Ghép thành file MP4 ----------
const u16s = (arr) => { const o = new Uint8Array(arr.length * 2), d = new DataView(o.buffer); arr.forEach((x, i) => d.setUint16(i * 2, x)); return o; };
function muxMp4(m, r) {
  const TS = 30000, DUR = TS / FPS, n = r.samples.length;
  const movieScale = m.scale, movieDur = Math.round((n / FPS) * movieScale);
  const ftyp = box('ftyp', new TextEncoder().encode('mp42'), words([0]), new TextEncoder().encode('isommp42'));

  // mvhd, tkhd chép từ file gốc (giữ ngày quay, hướng xoay), sửa thời lượng
  const mvhd = { ...m.mvhd, data: m.mvhd.data.slice() };
  setDur(mvhd, 16, 24, movieDur);
  dv(mvhd).setUint32(mvhd.hdr + (mvhd.data[mvhd.hdr] === 1 ? 108 : 96), 2);
  const srcTkhd = find(m.video.trak, 'tkhd');
  const tkhd = { ...srcTkhd, data: srcTkhd.data.slice() };
  setDur(tkhd, 20, 28, movieDur);
  dv(tkhd).setUint32(tkhd.hdr + (tkhd.data[tkhd.hdr] === 1 ? 20 : 12), 1);
  dv(tkhd).setUint32(tkhd.hdr, (tkhd.data[tkhd.hdr] << 24) | 3); // bật track

  // Thứ tự giải mã: dts tăng đều; ctts nếu bộ mã hoá có đảo khung
  const offs = r.samples.map((s, i) => Math.round((s.ts * TS) / 1e6) - i * DUR);
  const minOff = Math.min(0, ...offs);
  const hasCtts = offs.some((o) => o !== 0);
  const entry = box('avc1', new Uint8Array(6), u16s([1]), new Uint8Array(16), u16s([r.W, r.H]), words([0x00480000, 0x00480000, 0]), u16s([1]),
    new Uint8Array(32), u16s([0x18, 0xffff]), box('avcC', r.avcC));
  const sizes = r.samples.map((s) => s.data.length);
  const per = FPS; // số khung mỗi chunk
  const nChunks = Math.ceil(n / per);
  const sc = [[1, per, 1]]; if (n % per && nChunks > 1) sc.push([nChunks, n % per, 1]); if (nChunks === 1) sc[0][1] = n;
  const stbl = (base) => {
    const chunkOffs = []; let pos = base;
    for (let c = 0; c < nChunks; c++) { chunkOffs.push(pos); for (let i = c * per; i < Math.min(n, (c + 1) * per); i++) pos += sizes[i]; }
    const kids = [fullbox('stsd', 0, 0, words([1]), entry), fullbox('stts', 0, 0, words([1, n, DUR]))];
    if (hasCtts) {
      const flat = new Uint8Array(n * 8), d = new DataView(flat.buffer);
      offs.forEach((o, i) => { d.setUint32(i * 8, 1); d.setInt32(i * 8 + 4, o - minOff); });
      kids.push(fullbox('ctts', 0, 0, words([n]), flat));
    }
    const keys = r.samples.map((s, i) => s.key ? i + 1 : 0).filter(Boolean);
    kids.push(fullbox('stss', 0, 0, words([keys.length]), words(keys)), fullbox('stsc', 0, 0, words([sc.length]), words(sc.flat())),
      fullbox('stsz', 0, 0, words([0, n]), words(sizes)), fullbox('stco', 0, 0, words([nChunks]), words(chunkOffs)));
    return box('stbl', ...kids);
  };
  const edts = box('edts', fullbox('elst', 0, 0, words([1, movieDur]), words([-minOff], true), words([0x00010000])));
  const mdhd = fullbox('mdhd', 0, 0, words([0, 0, TS, n * DUR]), u16s([0x55c4, 0]));
  const hdlr = fullbox('hdlr', 0, 0, words([0]), new TextEncoder().encode('vide'), new Uint8Array(12), new TextEncoder().encode('VideoHandler\0'));
  const vmhd = fullbox('vmhd', 0, 1, new Uint8Array(8));
  const dinf = box('dinf', fullbox('dref', 0, 0, words([1]), fullbox('url ', 0, 1)));
  const extra = m.moov.kids.filter((k) => k.type === 'udta' || k.type === 'meta').map(serialize);
  const moov = (base) => box('moov', mvhd.data, box('trak', tkhd.data, edts, box('mdia', mdhd, hdlr, box('minf', vmhd, dinf, stbl(base)))), ...extra);
  const total = sizes.reduce((a, b) => a + b, 0);
  const len = moov(0).length;
  const base = ftyp.length + len + 8;
  const mdatHdr = new Uint8Array(8); new DataView(mdatHdr.buffer).setUint32(0, total + 8); mdatHdr.set([109, 100, 97, 116], 4);
  return new Blob([ftyp, moov(base), mdatHdr, ...r.samples.map((s) => s.data)], { type: 'video/mp4' });
}

// ---------- Giao diện ----------
const fmt = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60); return m + ':' + String(Math.round(s - m * 60)).padStart(2, '0'); };
const mb = (b) => (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
const num = (x) => (x >= 10 ? Math.round(x) : x.toFixed(1).replace('.', ','));
function say(text, kind) { const el = $('msg'); el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); el.classList.toggle('hide', !text); }

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || busy) return;
  file = f; movie = null;
  $('outCard').classList.add('hide');
  $('editCard').classList.remove('hide');
  $('hint').classList.add('hide');
  $('bar').classList.add('hide');
  if (srcUrl) URL.revokeObjectURL(srcUrl);
  srcUrl = URL.createObjectURL(f);
  $('src').src = srcUrl;
  $('info').textContent = f.name + ' · ' + mb(f.size);
  $('speed').textContent = '';
  $('goBtn').disabled = true; say('Đang đọc video…');
  try { movie = await openMovie(f); } catch (err) { say(err.message, 'err'); return; }
  const dur = movie.duration;
  $('info').textContent = `${f.name} · dài ${fmt(dur)} · ${mb(f.size)}`;
  if (dur <= LEN + 0.05) { say(`Video chỉ dài ${num(dur)} giây, không cần tua nhanh.`, 'ok'); return; }
  $('speed').textContent = `Tua nhanh ×${num(dur / LEN)}: ${fmt(dur)} → 0:15`;
  $('goBtn').disabled = false; say('');
});

$('goBtn').addEventListener('click', async () => {
  if (!movie || busy) return;
  busy = true;
  $('src').pause();
  $('goBtn').disabled = true;
  $('bar').classList.remove('hide'); $('barFill').style.width = '0%';
  say('Đang tua nhanh… Giữ màn hình mở, đừng chuyển sang app khác.');
  let lock = null;
  try { lock = await navigator.wakeLock?.request('screen'); } catch (_) {}
  const t = performance.now();
  try {
    const r = await speedUp(movie, (p) => { $('barFill').style.width = (p * 100).toFixed(1) + '%'; });
    const blob = muxMp4(movie, r);
    const base = file.name.replace(/\.[^.]+$/, '') || 'video';
    outFile = new File([blob], `${base}-tua-15s.mp4`, { type: 'video/mp4' });
    if (outUrl) URL.revokeObjectURL(outUrl);
    outUrl = URL.createObjectURL(outFile);
    $('out').src = outUrl;
    $('dl').href = outUrl; $('dl').download = outFile.name;
    $('outInfo').textContent = `Nhanh ×${num(r.speed)} · 15 giây · ${r.W}×${r.H} · ${mb(outFile.size)} · làm trong ${Math.round((performance.now() - t) / 1000)} giây`;
    $('shareBtn').classList.toggle('hide', !(navigator.canShare && navigator.canShare({ files: [outFile] })));
    $('outCard').classList.remove('hide');
    $('bar').classList.add('hide');
    say('');
    $('outCard').scrollIntoView({ behavior: 'smooth' });
    if ($('shareBtn').classList.contains('hide')) $('dl').click(); else saveOut(true);
  } catch (err) {
    say('Không tua được: ' + err.message, 'err');
  }
  try { await lock?.release(); } catch (_) {}
  busy = false;
  $('goBtn').disabled = false;
});

// Lưu: iPhone mở bảng Chia sẻ (chọn "Lưu video" để vào Ảnh). Safari không cho web tự ghi vào Ảnh,
// và chặn tự mở bảng nếu tua lâu — khi đó hiện nút lưu to giữa màn hình.
async function saveOut(auto) {
  try {
    await navigator.share({ files: [outFile] });
    $('saveBox').classList.add('hide');
  } catch (err) {
    if (err.name === 'AbortError') return;
    if (err.name === 'NotAllowedError' && auto) { $('saveBox').classList.remove('hide'); return; }
    alert('Không mở được bảng chia sẻ: ' + err.message);
  }
}
$('saveBig').addEventListener('click', () => saveOut(false));
$('saveSkip').addEventListener('click', () => $('saveBox').classList.add('hide'));
$('shareBtn').addEventListener('click', () => saveOut(false));

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
